name: Publicar v1.1

on:
  pull_request:
    branches: ["main"]
    types: [closed]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'agent/release-v1.1'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout da main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar instalador
        run: cp app/build/outputs/apk/debug/app-debug.apk RuidoBranco-v1.1.apk

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1 >/dev/null 2>&1; then
            gh release upload v1.1 RuidoBranco-v1.1.apk --clobber
          else
            gh release create v1.1 RuidoBranco-v1.1.apk \
              --target main \
              --title "Ruído Branco v1.1" \
              --latest \
              --notes "Primeira versão pública do Ruído Branco. Reprodução offline e contínua, controle de volume e timbre, funcionamento com a tela apagada, saída Bluetooth e identidade visual da lua dormindo."
          fi
