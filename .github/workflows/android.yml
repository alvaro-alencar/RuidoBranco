name: Android CI

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build release APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Rename release APK
        if: steps.build.outcome == 'success'
        run: cp app/build/outputs/apk/release/app-release.apk RuidoBranco-v1.2-release.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build.log
          if-no-files-found: error

      - name: Upload release APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ruido-branco-release
          path: RuidoBranco-v1.2-release.apk
          if-no-files-found: error

      - name: Fail when compilation fails
        if: steps.build.outcome != 'success'
        run: exit 1
